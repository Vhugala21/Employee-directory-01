# Employee Directory - Spring Boot Configuration
#
# PHASE 1 (INTENTIONAL): Hardcoded secret for training purposes
# In Phase 2, docker-compose.yml overrides this via environment variables:
#   DB_URL, DB_USER, DB_PASSWORD
#
# Spring Boot property precedence: env vars > application.properties
# So the docker-compose values win at runtime.
#
# NEVER commit real passwords to version control!
# This file is for LOCAL DEVELOPMENT ONLY.

spring.application.name=employee-directory
spring.datasource.url=jdbc:postgresql://localhost:5432/employees
spring.datasource.username=postgres
spring.datasource.password=hardcoded-secret-password
spring.jpa.hibernate.ddl-auto=update
server.port=8080
